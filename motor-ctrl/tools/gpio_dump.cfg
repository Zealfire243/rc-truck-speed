# Read-only snapshot of the F405's GPIO and TIM1 configuration, over SWD.
#
# Used in Phase 1a to see how the STOCK firmware configured the pins, as
# evidence for pin_map.h. It halts the core, reads registers, and resumes.
# Nothing is written or flashed. Run with the power stage unpowered: ST-Link
# 3V3 only, no pack, no motor.
#
#   openocd -f interface/stlink.cfg -f target/stm32f4x.cfg \
#     -f motor-ctrl/tools/gpio_dump.cfg 2>&1 | grep -v "^Info"
#
# Per port: MODER OTYPER OSPEEDR PUPDR IDR ODR, then AFRL AFRH.
# MODER is 2 bits per pin: 00 input, 01 output, 10 alternate, 11 analog.
# AFRL covers pins 0-7 and AFRH pins 8-15, 4 bits per pin (AF1 = TIM1).
init
halt
foreach {n b} {A 0x40020000 B 0x40020400 C 0x40020800 D 0x40020C00} {
  echo "GPIO$n MODER OTYPER OSPEEDR PUPDR IDR ODR"
  echo [mdw $b 6]
  echo "GPIO$n AFRL AFRH"
  echo [mdw [expr {$b+0x20}] 2]
}
echo "TIM1 CR1"
echo [mdw 0x40010000 1]
echo "TIM1 CCER"
echo [mdw 0x40010020 1]
echo "TIM1 BDTR"
echo [mdw 0x40010044 1]
resume
exit
